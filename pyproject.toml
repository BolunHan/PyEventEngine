[build-system]
requires = ["setuptools", "cython", "PyCyBase"]
build-backend = "setuptools.build_meta"

[project]
name = "PyEventEngine"
dynamic = ["version"]
description = "Python Basic EventEngine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Han Bolun", email = "Bolun.Han@outlook.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/BolunHan/PyEventEngine"
Repository = "https://github.com/BolunHan/PyEventEngine"
Issues = "https://github.com/BolunHan/PyEventEngine/issues"

[tool.setuptools.package-data]
"event_engine" = ["*.pyi", "*.pyx", "*.pxd", "*.h", "*.c"]
"event_engine.base" = ["*.pyi", "*.pyx", "*.pxd", "*.h", "*.c"]
"event_engine.capi" = ["*.pyi", "*.pyx", "*.pxd", "*.h", "*.c"]
"event_engine.includes" = ["**/*.h", "**/*.c", "**/*.cpp"]

[tool.setuptools.packages.find]
exclude = [
    "test", "test.*",
    "tests", "tests.*",
    "docs", "docs.*",
    "demo", "demo.*"
]

[tool.setuptools.dynamic]
version = { attr = "event_engine.__version__" }